<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfume Server 20</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">
      <span>PS</span>
      Perfume Server 20
    </div>

    <button class="cart-button" onclick="openCart()">
      🛒 <b id="cartCount">0</b>
    </button>
  </div>

  <div class="search">
    <input
      type="text"
      id="search"
      placeholder="Buscar perfumes..."
      oninput="renderProducts()"
    >
  </div>
</header>

<main>

  <section class="hero">
    <div class="hero-content">
      <small>PERFUME SERVER 20</small>

      <h1>
        Seu estilo.<br>
        <strong>Sua fragrância.</strong>
      </h1>

      <p>
        Encontre perfumes para deixar sua presença inesquecível.
      </p>

      <a href="#produtos">Ver produtos</a>
    </div>

    <div class="bottle">
      ✦
    </div>
  </section>


  <section id="produtos">

    <small class="label">
      CATÁLOGO
    </small>

    <h2>
      Produtos em destaque
    </h2>

    <div id="products" class="products"></div>

  </section>

</main>


<!-- FUNDO DO CARRINHO -->

<div
  id="overlay"
  onclick="closeCart()">
</div>


<!-- CARRINHO -->

<aside id="cart">

  <div class="cart-header">

    <h2>
      Seu carrinho
    </h2>

    <button onclick="closeCart()">
      ✕
    </button>

  </div>

  <div id="cartItems"></div>

  <div class="cart-footer">

    <div class="total">
      <span>Total</span>

      <strong id="total">
        R$ 0,00
      </strong>
    </div>

    <button
      class="checkout"
      onclick="checkout()">

      Finalizar pedido

    </button>

  </div>

</aside>


<footer>

  © 2026 Perfume Server 20

</footer>


<script src="script.js"></script>

</body>
</html>
