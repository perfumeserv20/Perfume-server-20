<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Painel — Perfume Server 20</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #172033;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 6px 0 0;
      color: #aab4c3;
      font-size: 14px;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .top h2 {
      margin: 0;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .reload {
      background: #111827;
      color: white;
    }

    .orders {
      display: grid;
      gap: 15px;
    }

    .order {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .order-id {
      font-size: 13px;
      color: #6b7280;
    }

    .customer {
      font-size: 18px;
      font-weight: bold;
      margin-top: 5px;
    }

    .status {
      background: #fff3cd;
      color: #856404;
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .items {
      margin-top: 18px;
      border-top: 1px solid #eee;
      padding-top: 15px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 0;
    }

    .total {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
    }

    .date {
      margin-top: 10px;
      color: #7b8494;
      font-size: 12px;
    }

    .status-area {
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .status-select {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
      font-size: 14px;
    }

    .save-status {
      background: #111827;
      color: white;
    }

    .empty {
      background: white;
      padding: 40px;
      text-align: center;
      border-radius: 16px;
      color: #718096;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 18px;
      border-radius: 12px;
    }

  </style>

</head>

<body>

  <header>

    <h1>
      Perfume Server 20
    </h1>

    <p>
      Painel de pedidos
    </p>

  </header>

  <main>

    <div class="top">

      <h2>
        Pedidos
      </h2>

      <button
        class="reload"
        onclick="loadOrders()">

        Atualizar

      </button>

    </div>

    <div
      id="orders"
      class="orders">

      Carregando...

    </div>

  </main>

  <script>

        async function loadOrders() {

      const container =
        document.getElementById("orders");

      container.textContent =
        "Carregando...";

      try {

        const response =
          await fetch("/api/admin-orders");

        const data =
          await response.json();

        if (!response.ok) {

          throw new Error(
            data.error ||
            "Erro ao carregar pedidos."
          );

        }

        if (
          !Array.isArray(data) ||
          data.length === 0
        ) {

          container.innerHTML = `
            <div class="empty">
              Nenhum pedido encontrado.
            </div>
          `;

          return;

        }

        container.innerHTML = "";

        data.forEach(order => {

          const orderElement =
            document.createElement("div");

          orderElement.className =
            "order";

          let itemsHtml = "";

          if (Array.isArray(order.items)) {

            order.items.forEach(item => {

              const price =
                Number(item.price) || 0;

              const quantity =
                Number(item.qty) || 0;

              itemsHtml += `

                <div class="item">

                  <span>
                    ${escapeHtml(item.name)}
                    × ${quantity}
                  </span>

                  <strong>
                    R$ ${price
                      .toFixed(2)
                      .replace(".", ",")}
                  </strong>

                </div>

              `;

            });

          }

          const total =
            Number(order.total) || 0;

          const date =
            new Date(order.created_at)
              .toLocaleString("pt-BR");

          orderElement.innerHTML = `

            <div class="order-top">

              <div>

                <div class="order-id">
                  Pedido #${escapeHtml(order.id)}
                </div>

                <div class="customer">
                  ${escapeHtml(order.user_name)}
                </div>

              </div>

              <span class="status">
                ${escapeHtml(order.status)}
              </span>

            </div>

            <div class="items">

              ${itemsHtml}

            </div>

            <div class="total">

              <span>
                Total
              </span>

              <span>
                R$ ${total
                  .toFixed(2)
                  .replace(".", ",")}
              </span>

            </div>

            <div class="date">

              ${escapeHtml(date)}

            </div>

            <div class="status-area">

              <select
                class="status-select"
                id="status-${escapeHtml(order.id)}">

                <option
                  value="aguardando_pagamento"
                  ${order.status === "aguardando_pagamento"
                    ? "selected"
                    : ""}>

                  Aguardando pagamento

                </option>

                <option
                  value="pago"
                  ${order.status === "pago"
                    ? "selected"
                    : ""}>

                  Pago

                </option>

                <option
                  value="enviado"
                  ${order.status === "enviado"
                    ? "selected"
                    : ""}>

                  Enviado

                </option>

                <option
                  value="concluido"
                  ${order.status === "concluido"
                    ? "selected"
                    : ""}>

                  Concluído

                </option>

              </select>

              <button
                class="save-status"
                onclick="updateStatus('${escapeHtml(order.id)}')">

                Salvar status

              </button>

            </div>

          `;

          container.appendChild(
            orderElement
          );

        });

      } catch (error) {

        console.error(error);

        container.innerHTML = `

          <div class="error">

            ${escapeHtml(
              error.message ||
              "Erro ao carregar pedidos."
            )}

          </div>

        `;

      }

    }


    async function updateStatus(id) {

      const select =
        document.getElementById(
          "status-" + id
        );

      if (!select) {

        alert(
          "Não foi possível encontrar o status."
        );

        return;

      }

      const status =
        select.value;

      try {

        const response =
          await fetch("/api/admin-status", {

            method: "PUT",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              id: id,

              status: status

            })

          });

        const data =
          await response.json();

        if (!response.ok) {

          throw new Error(
            data.error ||
            "Erro ao atualizar status."
          );

        }

        alert(
          "Status atualizado com sucesso!"
        );

        await loadOrders();

      } catch (error) {

        console.error(error);

        alert(
          error.message ||
          "Erro ao atualizar status."
        );

      }

    }


    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    window.addEventListener(
      "load",
      loadOrders
    );

  </script>

</body>

</html>
