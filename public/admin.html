<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Painel — Perfume Server 20</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #172033;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 6px 0 0;
      color: #aab4c3;
      font-size: 14px;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .top h2 {
      margin: 0;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .reload {
      background: #111827;
      color: white;
    }

    .orders {
      display: grid;
      gap: 15px;
    }

    .order {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .order-id {
      font-size: 13px;
      color: #6b7280;
    }

    .customer {
      font-size: 18px;
      font-weight: bold;
      margin-top: 5px;
    }

    .status {
      background: #fff3cd;
      color: #856404;
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .items {
      margin-top: 18px;
      border-top: 1px solid #eee;
      padding-top: 15px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 0;
    }

    .total {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
    }

    .date {
      margin-top: 10px;
      color: #7b8494;
      font-size: 12px;
    }

    .status-area {
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .status-select {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
      font-size: 14px;
    }

    .save-status {
      background: #111827;
      color: white;
    }

    .empty {
      background: white;
      padding: 40px;
      text-align: center;
      border-radius: 16px;
      color: #718096;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 18px;
      border-radius: 12px;
    }

  </style>

</head>

<body>

  <header>

    <h1>
      Perfume Server 20
    </h1>

    <p>
      Painel de pedidos
    </p>

  </header>

  <main>

      <h2>

        class="reload
