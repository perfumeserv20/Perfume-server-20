<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Painel — Perfume Server 20</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #172033;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 6px 0 0;
      color: #aab4c3;
      font-size: 14px;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .top h2 {
      margin: 0;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .reload {
      background: #111827;
      color: white;
    }

    .orders {
      display: grid;
      gap: 15px;
    }

    .order {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .order-id {
      font-size: 13px;
      color: #6b7280;
    }

    .customer {
      font-size: 18px;
      font-weight: bold;
      margin-top: 5px;
    }

    .status {
      background: #fff3cd;
      color: #856404;
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .items {
      margin-top: 18px;
      border-top: 1px solid #eee;
      padding-top: 15px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 0;
    }

    .total {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
    }

    .date {
      margin-top: 10px;
      color: #7b8494;
      font-size: 12px;
    }

    .empty {
      background: white;
      padding: 40px;
      text-align: center;
      border-radius: 16px;
      color: #718096;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 18px;
      border-radius: 12px;
    }

  </style>

</head>


<body>

  <header>

    <h1>
      Perfume Server 20
    </h1>

    <p>
      Painel de pedidos
    </p>

  </header>


  <main>

    <div class="top">

      <h2>
        Pedidos
      </h2>

      <button
        class="reload"
        onclick="loadOrders()">

        Atualizar

      </button>

    </div>


    <div
      id="orders"
      class="orders">

      Carregando...

    </div>

  </main>


  <script>

    async function loadOrders() {

      const container =
        document.getElementById("orders");


      container.innerHTML =
        "Carregando...";


      try {

        const response =
          await fetch("/api/admin-orders");


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Erro ao carregar pedidos."
          );

        }


        if (
          !Array.isArray(data) ||
          data.length === 0
        ) {

          container.innerHTML = `
            <div class="empty">
              Nenhum pedido encontrado.
            </div>
          `;

          return;

        }


        container.innerHTML =
          data.map(order => `

            <div class="order">

              <div class="order-top">

                <div>

                  <div class="order-id">
                    Pedido #${order.id}
                  </div>

                  <div class="customer">
                    ${escapeHtml(order.user_name)}
                  </div>

                </div>

                <span class="status">
                  ${escapeHtml(order.status)}
                </span>

              </div>


              <div class="items">

                ${order.items.map(item => `

                  <div class="item">

                    <span>
                      ${escapeHtml(item.name)}
                      × ${item.qty}
                    </span>

                    <strong>
                      R$ ${Number(item.price)
                        .toFixed(2)
                        .replace(".", ",")}
                    </strong>

                  </div>

                `).join("")}

              </div>


              <div class="total">

                <span>
                  Total
                </span>

                <span>
                  R$ ${Number(order.total)
                    .toFixed(2)
                    .replace(".", ",")}
                </span>

              </div>


              <div class="date">
                ${new Date(order.created_at)
                  .toLocaleString("pt-BR")}
              </div>

            </div>

          `).join("");


      } catch (error) {

        console.error(error);

        container.innerHTML = `

          <div class="error">
            ${escapeHtml(error.message)}
          </div>

        `;

      }

    }


    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    loadOrders();

  </script>

</body>

</html>
